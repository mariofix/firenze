; ============================================================
; extensions_services.conf — unified service entrypoint
;
; All inbound services flow through [prepago-service].
; No per-service dialplan code — service config lives in the DB
; (Service.auth_method, Service.intro_audio) and is injected by
; Firenze via [selecciona-servicio] (extensions_zvn.conf).
;
; Replaces:
;   extensions_alotarot.conf
;   extensions_fonotarot.conf  (all prepago-* contexts)
;   [selecciona-ejecutivo-prepago]
;   [limite-saldo]
;   [llama-tarotista]
;   [outbound-ejecutivos] / [outbound-didww] / [outbound-claro1]
;
; CURL conventions used throughout:
;   GET    : Set(CURLOPT(postfields)=)    + Set(CURLOPT(httpcustom)=)
;   POST   : Set(CURLOPT(postfields)=k=v) + Set(CURLOPT(httpcustom)=)
;   POST (no body): Set(CURLOPT(postfields)=) + Set(CURLOPT(httpcustom)=POST)
;   DELETE : Set(CURLOPT(postfields)=)    + Set(CURLOPT(httpcustom)=DELETE)
;   PATCH  : Set(CURLOPT(postfields)=)    + Set(CURLOPT(httpcustom)=PATCH)
;
; Variables set by [selecciona-servicio] before entering here:
;   siguiente    — "prepago-service" (all new DIDs)
;   servicio     — service slug  (e.g. "alotarot", "fonotarot-cl")
;   auth_method  — "ani" | "pin"
;   intro_audio  — Playback string (e.g. "zvn/intro-alotarot")
; ============================================================


; --- Common entrypoint ----------------------------------------

[prepago-service]
exten => s,1,NoOp(Prepago ${servicio} | auth=${auth_method})
 same => n,Answer()
 same => n,Set(clientid=0)
 same => n,Set(segundos=0)
 same => n,Set(OPERATOR_NUM=0)
 same => n,Set(AGIEXITONHANGUP=yes)
 same => n,NoOp(did=${did} ani=${ani})
 ; DNC check — hang up silently if ANI is on the do-not-call list
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/dnc/${ani})})
 same => n,GotoIf($["${JSON_DECODE(resp,dnc)}" = "YES"]?Hangup:)
 same => n,Playback(${intro_audio})
 same => n,GotoIf($["${auth_method}" = "pin"]?auth-pin,s,1:auth-ani,s,1)

exten => h,1,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=DELETE)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 same => n,NoOp(Goodbye)


; --- Shared post-auth subroutine ------------------------------
; Called via Gosub after clientid + segundos are confirmed valid.
; Expects channel vars: clientid, segundos, servicio, ani, did.
;
; Always exits via Goto — never returns to caller:
;   → [selecciona-operador] on success
;   → [saldo-insuficiente]  on zero credits or failed call insert

[sub-post-auth]
exten => s,1,Set(CDR(zvn_clientid)=${clientid})
 same => n,Set(CDR(userfield)=${servicio})
 same => n,NoOp(ClientID=${clientid} Creditos=${segundos})
 same => n,GotoIf($["${segundos}" = "0"]?saldo-insuficiente,s,1:)
 ; Set absolute call timeout and play balance announcement
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/credits/limit?seconds=${segundos})})
 same => n,Set(TIMEOUT(absolute)=${JSON_DECODE(resp,timeout)})
 same => n,Set(saldo_audio=${JSON_DECODE(resp,audio)})
 same => n,GotoIf($["${saldo_audio}" = ""]?insert:)
 same => n,Playback(${saldo_audio})
 same => n(insert),Set(CURLOPT(postfields)=service=${servicio}&ani=${ani}&did=${did}&client_id=${clientid}&operator=0)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online)})
 same => n,GotoIf($["${JSON_DECODE(resp,ok)}" = "true"]?selecciona-operador,s,1:saldo-insuficiente,s,1)


; --- ANI-based auth -------------------------------------------
; Looks up client by ANI, checks for a duplicate active call,
; then hands off to [sub-post-auth].

[auth-ani]
exten => s,1,NoOp(ANI lookup: ${ani} servicio=${servicio})
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/clients/lookup?service=${servicio}&identifier=${ani})})
 same => n,Set(clientid=${JSON_DECODE(resp,clientid)})
 same => n,Set(segundos=${JSON_DECODE(resp,segundos)})
 same => n,GotoIf($["${clientid}" = "0"]?outbound-supervisor,s,1:)
 ; Duplicate active-call guard (ANI services only)
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 same => n,GotoIf($["${JSON_DECODE(resp,llamada_activa)}" = "true"]?saldo-insuficiente,s,1:)
 same => n,Gosub(sub-post-auth,s,1)

exten => h,1,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=DELETE)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 same => n,NoOp(Goodbye)


; --- PIN-based auth -------------------------------------------
; Prompts caller for PIN, looks up client, then hands off to [sub-post-auth].
; Retries up to the Read timeout on bad/empty PIN.

[auth-pin]
exten => s,1,NoOp(PIN lookup servicio=${servicio})
 same => n(pide-pin),Read(pin,zvn/new-enter-pin&beep,8,s,2,10)
 same => n,GotoIf($["${pin}" = ""]?bad-pin:)
 same => n,NoOp(pin=${pin})
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/clients/lookup?service=${servicio}&identifier=${pin})})
 same => n,Set(clientid=${JSON_DECODE(resp,clientid)})
 same => n,Set(segundos=${JSON_DECODE(resp,segundos)})
 same => n,GotoIf($["${clientid}" = "0"]?bad-pin:)
 same => n,Playback(zvn/new-good-pin)
 same => n,Gosub(sub-post-auth,s,1)
 same => n(bad-pin),Playback(zvn/bad-pin)
 same => n,Goto(pide-pin)

exten => h,1,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=DELETE)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 same => n,NoOp(Goodbye)


; --- Insufficient balance ------------------------------------

[saldo-insuficiente]
exten => s,1,NoOp(Saldo insuficiente para ${ani})
 same => n,Playback(zvn/saldo-insuficiente&zvn/espere-linea-supervisor)
 same => n,Goto(outbound-supervisor,s,1)

exten => h,1,NoOp(Goodbye)


; --- Operator selection ---------------------------------------
; Replaces [selecciona-ejecutivo-prepago] + Agi(${AUDIOTEX},ejecutivos_disponibles)
; and Agi(${AUDIOTEX},ejecutivo_aleatorio).
;
; Standalone context (not Gosub) — exits via Goto(llama-operador,...).
; [llama-operador] returns here on dial failure via Goto(...,s,busca).

[selecciona-operador]
exten => s,1,NoOp(Buscando operador disponible para ${servicio})
 same => n(busca),Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/menu)})
 same => n,Set(disponibles=${JSON_DECODE(resp,disponibles)})
 same => n,Set(audio_str=${JSON_DECODE(resp,audio_str)})
 same => n,GotoIf($["${disponibles}" = "0"]?no-operators:menu)
 same => n(menu),Read(opcion,zvn/menutarot,1,s,1,5)
 same => n,GotoIf($["${opcion}" = "1"]?lista:)
 same => n,GotoIf($["${opcion}" = "2"]?aleatorio:busca)
 same => n(lista),NoOp(Seleccion por lista)
 same => n,Read(seleccion,${audio_str},2,s,2,1)
 same => n,GotoIf($["${seleccion}" = ""]?busca:)
 same => n,Set(CURLOPT(postfields)=mode=option&selection=${seleccion})
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/select)})
 same => n,GotoIf($["${JSON_DECODE(resp,ok)}" = "true"]?got-operator:operator-busy)
 same => n(aleatorio),NoOp(Seleccion aleatoria)
 same => n,Set(CURLOPT(postfields)=mode=random)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/select)})
 same => n,GotoIf($["${JSON_DECODE(resp,ok)}" = "true"]?got-operator:operator-busy)
 same => n(operator-busy),Playback(zvn/ocupado)
 same => n,Goto(busca)
 same => n(no-operators),Playback(zvn/ocupado)
 same => n,Wait(5)
 same => n,Goto(busca)
 same => n(got-operator),Set(OPERATOR_NUM=${JSON_DECODE(resp,operador_numero)})
 same => n,Set(OPERATOR_TEL=${JSON_DECODE(resp,operador_telefono)})
 same => n,Set(OPERATOR_NAM=${JSON_DECODE(resp,operador_nombre)})
 same => n,Set(OPERATOR_TRUNK=${JSON_DECODE(resp,operador_trunk)})
 ; Update online call record with selected operator
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=PATCH)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani}?operator=${OPERATOR_NUM})})
 same => n,NoOp(Operador: ${OPERATOR_NUM} ${OPERATOR_NAM})
 same => n,Goto(llama-operador,${OPERATOR_NUM},1)

exten => h,1,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=DELETE)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 same => n,NoOp(Goodbye)


; --- Dial operator + post-call --------------------------------
; Replaces [llama-tarotista] + [outbound-ejecutivos/didww/claro1].
; Trunk determined per-operator (OperatorPhone.trunk).
; On dial failure: release operator and retry operator selection.
; On hangup after answer: release operator, delete call, deduct credits.

[llama-operador]
exten => _XXXX,1,NoOp(Llamando a ${OPERATOR_NUM} via ${OPERATOR_TRUNK})
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},America/Santiago,%Y/%m)}/${servicio}-${clientid}-${ani}-${OPERATOR_NUM}-${UNIQUEID}.gsm)
 same => n,MixMonitor(${REC_FILE},ab)
 same => n,Set(CALLERID(num)=56222301515)
 same => n,Dial(PJSIP/${OPERATOR_TEL:2}@${OPERATOR_TRUNK})
 same => n,NoOp(DIALSTATUS=${DIALSTATUS})
 ; ANSWER — call connected and ended normally, let h handler clean up
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?Hangup:release)
 ; Any other status — release operator and retry
 same => n(release),Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=POST)
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/${OPERATOR_NUM}/release)})
 same => n,Goto(selecciona-operador,s,busca)

exten => h,1,NoOp(Post-call ${servicio} cli=${clientid} billsec=${CDR(billsec)})
 same => n,StopMixMonitor()
 ; Release operator
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=POST)
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/${OPERATOR_NUM}/release)})
 ; Delete online call record
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=DELETE)
 same => n,Set(resp=${CURL(${FIRENZE_API}/calls/online/${servicio}/${ani})})
 ; Deduct credits — only if call actually connected (billsec > 0)
 same => n,GotoIf($[${CDR(billsec)} > 0]?deduct:done)
 same => n(deduct),Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=POST)
 same => n,Set(resp=${CURL(${FIRENZE_API}/clients/${servicio}/${clientid}/deduct?seconds=${CDR(billsec)})})
 same => n(done),NoOp(Goodbye)
