[general]
static=yes
clearglobalvars=no

[globals]
; Firenze FastAPI server — all dialplan HTTP calls go here.
; Replace AGI subprocess spawns (~500-1500ms each) with CURL (~5-10ms).
FIRENZE_API=http://127.0.0.1:3002/agi

; Leading characters to strip from operator phone number (E.164) per trunk.
; All numbers stored as 56XXXXXXXXX. Each trunk gets what it expects.
; Undefined trunk → strip=0 → full E.164 sent (safe default for DIDWW-style).
TRUNK_STRIP_didww-mia-out=0
TRUNK_STRIP_tecnoera=2
TRUNK_STRIP_claro1=2

[honeypot]
exten => _X.,1,NoOp(${PJSIP_HEADER(read,from)})
 same => n,Playback(tt-monkeys)

exten => h,1,NoOp(Goodbye)

[public]
include => honeypot

[default]
include => honeypot

[escucha-musica]
exten => s,1,Noop(Vamos a llamar para musica)
 same => n,Answer()
 same => n,Dial(PJSIP/1234@claro1)

[aviso-cinco-minutos]
exten => s,1,NoOp(Aviso de 5 Minutos)
same => n,Playback(zvn/aviso)
same => n,Bridge(${BRIDGE_CHANNELS})
same => n,Hangup()

[barge-in]
exten => s,1,Noop(Barge-in Attempt)
same => n,Bridge(${CHANNEL_TO_BARGE})
same => n,Hangup()

#include extensions_zvn.conf
#include extensions_services.conf
