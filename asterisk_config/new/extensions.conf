[general]
static=yes
clearglobalvars=no

[globals]
FIRENZE=/home/zvn/public_apps/firenze/.venv/bin/firenze
AUDIOTEX=/home/zvn/public_apps/firenze/asterisk_agi/audiotex.py
; Firenze FastAPI server — all dialplan HTTP calls go here.
; Replace AGI subprocess spawns (~500-1500ms each) with CURL (~5-10ms).
FIRENZE_API=http://localhost:9002/agi

; Leading characters to strip from operator phone number (E.164) per trunk.
; All numbers stored as 56XXXXXXXXX. Each trunk gets what it expects.
; Undefined trunk → strip=0 → full E.164 sent (safe default for DIDWW-style).
TRUNK_STRIP_didww-mia-out=0
TRUNK_STRIP_tecno=2
TRUNK_STRIP_tecnoera=2

TRUNK_DEFAULT=tecnoera

[honeypot]
exten => _X.,1,NoOp(${PJSIP_HEADER(read,from)})
 same => n,Playback(llamada-activa)

exten => h,1,NoOp(Goodbye)

[public]
include => honeypot

[default]
include => honeypot

[moh-test]
exten => s,1,Noop(Music On hold)
 same => n,Answer()
 same => n,Set(LIMIT_TIMEOUT_FILE=beep)
 same => n,Set(LIMIT_WARNING_FILE=beep)
 same => n,Set(LIMIT_PLAYAUDIO_CALLEE=YES)
 ;same => n,Dial(PJSIP/997263037@tecnoera,20,m(default)L(60000:30000:9999))
 same => n,Dial(PJSIP/997263037@tecnoera,20,a(:zvn/saldo/30)m(default)L(60000:30000:9999))

[tts-ai-test]
exten => s,1,Noop(TTS-Ai-Test)
 same => n,Playback(https://api.cartesia.ai/tts/bytes?api_key=YOUR_KEY&model_id=sonic3.5&language=es&transcript=Su+saldo+es+de5+minutos+25+segundos&output_format=pcm_8000)
; f786b574-daa5-4673-aa0c-cbe3e8534c02 voice-id katie eeuu en español


#include extensions_zvn.conf
#include extensions_services.conf
