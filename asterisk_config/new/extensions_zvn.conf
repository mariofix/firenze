; ============================================================
; extensions_zvn.conf — trunk routing + operator login/logout
;
; Inbound trunks normalise did/ani then jump to [selecciona-servicio].
; [selecciona-servicio] asks Firenze for the full service config in one
; CURL call and routes to [prepago-service] (extensions_services.conf).
;
; Removed from this file (moved to extensions_services.conf):
;   [outbound-ejecutivos]  — replaced by [llama-operador]
;   [outbound-didww]       — replaced by [llama-operador]
;   [outbound-claro1]      — replaced by [llama-operador]
;   [selecciona-ejecutivo-prepago] — replaced by [selecciona-operador]
;   [limite-saldo]         — replaced by GET /agi/credits/limit
;   [llama-tarotista]      — replaced by [llama-operador]
; ============================================================


; --- DID resolution -------------------------------------------

[selecciona-servicio]
exten => _X.,1,NoOp(Seleccionando servicio para DID ${did})
 same => n,Set(AGIEXITONHANGUP=yes)
 same => n,Set(CURLOPT(postfields)=)
 same => n,Set(CURLOPT(httpcustom)=)
 same => n,Set(resp=${CURL(${FIRENZE_API}/services/did/${did})})
 same => n,Set(siguiente=${JSON_DECODE(resp,siguiente)})
 same => n,Set(servicio=${JSON_DECODE(resp,servicio)})
 same => n,Set(auth_method=${JSON_DECODE(resp,auth_method)})
 same => n,Set(intro_audio=${JSON_DECODE(resp,intro_audio)})
 same => n,GotoIf($["${siguiente}" = ""]?no-service,s,1:)
 same => n,Goto(${siguiente},s,1)

exten => h,1,NoOp(Goodbye)


[no-service]
exten => s,1,NoOp(DID ${did} no reconocido)
 same => n,Set(CDR(userfield)=${did})
 same => n,Hangup(27)

exten => h,1,Log(WARNING,"DID ${did} not found — ANI: ${ani} From: ${PJSIP_HEADER(read,from)}")


; --- Inbound trunks -------------------------------------------
; Each trunk normalises did/ani to E.164 (56XXXXXXXXX) then routes.

[inbound-didww]
exten => _X.,1,NoOp(Llamada entrante DIDWW)
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,NoOp(${PJSIP_HEADER(read,from)})
 same => n,NoOp(Recibimos una llamada para ${EXTEN})
 same => n,Set(did=${EXTEN})
 same => n,Set(ani=${CALLERID(num)})
 same => n,Goto(selecciona-servicio,${did},1)

[inbound-tecnoera]
exten => _X.,1,NoOp(Llamada entrante Tecnoera)
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,NoOp(Recibimos una llamada para ${EXTEN} de ${CALLERID(num):-9})
 same => n,Set(did=56${EXTEN})
 same => n,Set(ani=56${CALLERID(num):-9})
 same => n,Goto(selecciona-servicio,${did},1)

[inbound-claro1]
exten => _X.,1,NoOp(Llamada entrante Claro)
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,NoOp(Recibimos una llamada para ${EXTEN})
 same => n,Set(did=${EXTEN})
 same => n,Set(ani=${CALLERID(num)})
 same => n,Goto(selecciona-servicio,${did},1)


; --- Outbound (supervisor only) --------------------------------
; Operator outbound is handled inside [llama-operador] in extensions_services.conf.

[outbound-supervisor]
exten => s,1,NoOp(Marcando al supervisor)
 same => n,Set(CALLERID(num)=222301515)
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},America/Santiago,%Y/%m)}/${ani}-supervisor-${UNIQUEID}.gsm)
 same => n,MixMonitor(${REC_FILE},ab)
 same => n,Dial(PJSIP/963349072@tecno)
 same => n,StopMixMonitor()


; --- Operator login / logout ----------------------------------
; Called when an operator dials a special DID mapped to these contexts.
; Uses CURL — replaces Agi(${AUDIOTEX},cambia_login,...).

[tarotista-login]
exten => s,1,NoOp(Login Tarotista ${ani})
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/by-phone/${ani}/login,_=1)})
 same => n,GotoIf($["${JSON_DECODE(resp,ok)}" = "true"]?ok:no-operator)
 same => n(ok),Playback(zvn/good-pin)
 same => n,Hangup()
 same => n(no-operator),NoOp(Tarotista no encontrado para ${ani})
 same => n,Goto(outbound-supervisor,s,1)

exten => h,1,NoOp(Goodbye)


[tarotista-logout]
exten => s,1,NoOp(Logout Tarotista ${ani})
 same => n,Set(resp=${CURL(${FIRENZE_API}/operators/by-phone/${ani}/logout,_=1)})
 same => n,GotoIf($["${JSON_DECODE(resp,ok)}" = "true"]?ok:no-operator)
 same => n(ok),Playback(zvn/good-pin)
 same => n,Hangup()
 same => n(no-operator),NoOp(Tarotista no encontrado para ${ani})
 same => n,Goto(outbound-supervisor,s,1)

exten => h,1,NoOp(Goodbye)
