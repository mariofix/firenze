[llama-tarotista]
include => outbound-entel
exten => _XXXX,1,Noop(Ultima verificacion antes de llamar)
 same => n,Agi(zvn/audiotex.py,info_ejecutivo,operator,${OPERATOR_NUM})
 same => n,Noop(siguiente=${siguiente}) 
 same => n,GotoIf($["${siguiente}" = ""]?:${siguiente})
 same => n,Agi(zvn/audiotex.py,cambia_estado,${OPERATOR_NUM},0)
 same => n,Goto(${OPERATOR_TEL},1) 
 same => n,Hangup()
 same => n(no-operator),Noop(Operador no disponible)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)
 same => n(operator-busy),Noop(Operador ocupado)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)

exten => h,1,Noop(Procesos post llamada)
 same => n,StopMixMonitor()
 same => n,Agi(zvn/audiotex.py,cambia_estado,${OPERATOR_NUM},1)
 same => n,Agi(zvn/audiotex.py,elimina_llamada_online,${ani})
 same => n,Agi(zvn/portal.py,inserta_llamada_cdr,${ani},${did},${CDR(billsec)},${clientid},${OPERATOR_NUM})
 same => n,Agi(zvn/audiotex.py,resta_saldo,${CDR(billsec)},${clientid},${servicio})
 same => n,NoOp(Goodbye)


[inbound-didww]
exten => _X.,1,Noop(Llamada entrante DIDWW)
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Noop(${PJSIP_HEADER(read,from)})
 same => n,Noop(Recibimos una llamada para ${EXTEN})
 same => n,Set(did=${EXTEN})
 same => n,Set(ani=${CALLERID(num)})
 same => n,Set(full_ani=${CALLERID(num)})
 same => n,Goto(selecciona-servicio,${did},1)

[inbound-entel]
exten => _X.,1,Noop(Llamada entrante Entel)
 same => n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Noop(${PJSIP_HEADER(read,from)})
 same => n,Noop(Recibimos una llamada para ${EXTEN})
 same => n,Set(did=56${EXTEN})
 same => n,Set(ani=${CALLERID(num)})
 same => n,Set(full_ani=56${CALLERID(num)})
 same => n,Agi(/home/mariofix/proyectos/firenze/cli.py,dnc-search,${full_ani})
 same => n,GotoIf($["${dnc}" = "YES"]?dnc-call,s,1:)
 same => n,Goto(selecciona-servicio,${did},1)


[outbound-didww]
; Se debe usar Goto cuando da lo mismo el estado de la llamada 
; P.ej: Al supervisor
; De lo contrario se debe incluir en el contexto
; La llamada se realiza desde el mismo contexto
; Ejecutando las acciones de corte
exten => _56.,1,Noop(Marcando DIDWW)
 same => n,MixMonitor(${servicio}-${clientid}-${ani}-${OPERATOR_NUM}-${UNIQUEID}.gsm,ab)
 same => n,Dial(PJSIP/${EXTEN}@didww-mia-out)
 ;same => n,Dial(PJSIP/56229402147@didww-mia-out)
 same => n,StopMixMonitor()
 same => n,Goto(${DIALSTATUS},1)

exten => BUSY,1,Noop(Telefono Ocupado)
 ;same => n,Agi(zvn/audiotex.py,cambia_estado,${ejecutivo},1)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)

exten => CONGESTION,1,Noop(Red Ocupada)
 ;same => n,Agi(zvn/audiotex.py,cambia_estado,${ejecutivo},1)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)

exten => CHANUNAVAIL,1,Noop(Red Ocupada)
 ;same => n,Agi(zvn/audiotex.py,cambia_estado,${ejecutivo},1)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)

exten => FAILED,1,Noop(Numero Malo)
 ;same => n,Agi(zvn/audiotex.py,cambia_estado,${ejecutivo},1)
 same => n,Set(salida=prepago-${servicio})
 same => n,Goto(${salida},s,selecciona-ejecutivo)

exten => h,1,NoOp(Goodbye)

[outbound-entel]
; Se debe usar Goto cuando da lo mismo el estado de la llamada 
; P.ej: Al supervisor
; De lo contrario se debe incluir en el contexto
; La llamada se realiza desde el mismo contexto
; Ejecutando las acciones de corte
exten => _569,1,Noop(Marcando Celular por DIDWW)
 same => n,MixMonitor(${servicio}-${clientid}-${ani}-${OPERATOR_NUM}-${UNIQUEID}.gsm,ab)
 same => n,Dial(PJSIP/${EXTEN}@didww-mia-out)
 same => n,StopMixMonitor()
 same => n,Goto(${DIALSTATUS},1)

exten => _56.,1,Noop(Marcando Entel)
 same => n,Set(CALLERID(num)=222301515)
 same => n,MixMonitor(${servicio}-${clientid}-${ani}-${OPERATOR_NUM}-${UNIQUEID}.gsm,ab)
 same => n,Dial(PJSIP/${EXTEN:2}@entel-out)
 same => n,StopMixMonitor()
