site_name: Firenze - Asterisk Admin
site_url: https://gitlab.com/mariofix/firenze
repo_url: https://gitlab.com/fonotarot/firenze
repo_name: mariofix/firenze
site_description: Firenze Docs
site_author: mariofix <yo@mariofix.com>
copyright: "&copy;2022 - Mario Hernández"
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: teal
  features:
    - navigation.tracking
    - navigation.top
    - header.autohide

plugins:
  - mkdocstrings
  - git-authors

nav:
  - index.md

markdown_extensions:

  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

