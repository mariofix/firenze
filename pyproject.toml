[tool.poetry]
name = "firenze"
version = "1.0.7"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{include = "firenze"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.95.1"
thankyou = "^0.0.1"
pymysql = "^1.0.3"
python-dotenv = "^1.0.0"
requests = "^2.28.2"
python-slugify = "^8.0.1"
alembic = "^1.10.3"
sqlalchemy = "^2.0.9"
peewee = "^3.16.0"
bcrypt = "^4.0.1"
sentry-sdk = "^1.19.1"
python-multipart = "^0.0.6"
jinja2 = "^3.1.2"
pystrix = "^1.2.0"
sqladmin = "^0.10.1"
phonenumbers = "^8.13.9"
sqlalchemy-repr = "^0.1.0"
uvicorn = {extras = ["standard"], version = "^0.21.1"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
typer = {extras = ["all"], version = "^0.7.0"}
fastapi-debug-toolbar = "^0.3.2"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "^20.1.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
pytest = "^7.3.1"
coverage = "^7.2.3"

[tool.poetry.scripts]
firenze = "cli:cli"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
