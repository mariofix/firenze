[tool.poetry]
name = "firenze-zvn"
version = "2024.1.0"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{ include = "firenze" }]

[tool.poetry.dependencies]
python = "^3.11"
thankyou = "^0.0.3"
pymysql = "^1.1.0"
python-dotenv = "^1.0"
requests = "^2.31"
python-slugify = "^8.0.1"
alembic = "^1.11.1"
sqlalchemy = "^2.0.15"
peewee = "^3.16.2"
bcrypt = "^4.1"
sentry-sdk = "^1.39"
python-multipart = "^0.0.6"
jinja2 = "^3.1.2"
pystrix = "^1.2.0"
sqladmin = "^0.16.0"
phonenumbers = "^8.13.27"
sqlalchemy-repr = "^0.1.0"
uvicorn = {extras = ["standard"], version = "^0.25.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
typer = {extras = ["all"], version = "^0.9.0"}
fastapi-debug-toolbar = "*"
python-dateutil = "^2.8.2"
fastapi-crudrouter = "^0.8.6"
pydantic = { extras = ["email"], version = "^1.10.8" }
fastapi = "^0.108.0"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
coverage = "*"
isort = "^5.12.0"

[tool.poetry.scripts]
firenze = "cli:cli"

[tool.black]
line_length = 88

[tool.isort]
profile = "black"
skip_gitignore = true
src_paths = ["firenze"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
