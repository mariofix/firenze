[project]
name = "firenze"
version = "2026.4.1"
description = "Servicio de comunicacion y administracion para servicio Tatot"
readme = "README.md"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "daleks[contrib] @ git+https://github.com/mariofix/daleks.git",
  "fastapi[all]>=0.136.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "phonenumbers>=9.0.28",
  "pydantic-settings>=2.14.0",
  "pydantic[email]>=2.13.3",
  "pymysql>=1.1.2",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.26",
  "python-slugify>=8.0.4",
  "requests>=2.33.1",
  "sqladmin>=0.25.0",
  "sqlalchemy-repr>=0.1.0",
  "typer>=0.24.2",
  "uvicorn[standard]>=0.46.0",
  "valkey>=6.1.1",
]

[project.scripts]
firenze = "firenze.cli:cli"

[tool.poetry]
packages = [{ include = "firenze" }]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
timezone = "America/Santiago"

[tool.ruff]
line-length = 119

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firenze"]
