[project]
name = "firenze"
version = "2026.5.1"
description = "Servicio de comunicacion y administracion para servicio Tatot"
readme = "README.md"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "daleks[contrib] @ git+https://github.com/mariofix/daleks.git",
  "fastapi[all]>=0.136.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "phonenumbers>=9.0.28",
  "pydantic-settings>=2.14.0",
  "pydantic[email]>=2.13.3",
  "pymysql>=1.1.2",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.26",
  "python-slugify>=8.0.4",
  "requests>=2.33.1",
  "sqladmin>=0.25.0",
  "sqlalchemy>=2.0.48",
  "sqlalchemy-repr>=0.1.0",
  "typer>=0.24.2",
  "uvicorn[standard]>=0.46.0",
  "valkey>=6.1.1",
  "bcrypt>=4.3",
  "pyjwt>=2.8.0",
  "gunicorn (>=25.3.0,<26.0.0)",
  "redis (>=7.4.0,<8.0.0)",
]

[project.scripts]
firenze = "firenze.cli:cli"

[project.optional-dependencies]
dev = [
  "fastapi-debug-toolbar (>=0.6.3,<0.7.0)",
  "isort (>=8.0.1,<9.0.0)",
  "pytest (>=9.0.3,<10.0.0)",
  "pytest-flask (>=1.3.0,<2.0.0)",
  "black (>=26.3.1,<27.0.0)",
  "pre-commit (>=4.6.0,<5.0.0)",
  "coverage (>=7.13.5,<8.0.0)",
  "ruff (>=0.15.12,<0.16.0)",
  "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
packages = [{ include = "firenze" }]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
timezone = "America/Santiago"

[tool.ruff]
line-length = 119

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["firenze"]

[dependency-groups]
dev = [
  "fastapi-debug-toolbar (>=0.6.3,<0.7.0)",
  "isort (>=8.0.1,<9.0.0)",
  "pytest (>=9.0.3,<10.0.0)",
  "pytest-flask (>=1.3.0,<2.0.0)",
  "black (>=26.3.1,<27.0.0)",
  "pre-commit (>=4.6.0,<5.0.0)",
  "coverage (>=7.13.5,<8.0.0)",
  "ruff (>=0.15.12,<0.16.0)",
  "httpx (>=0.28.1,<0.29.0)",
]
