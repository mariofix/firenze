[tool.poetry]
name = "firenze"
version = "1.1.0"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{include = "firenze"}]

[tool.poetry.dependencies]
python = "^3.10"
starlette = {extras = ["full"], version = "^0.22.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
uvicorn = {extras = ["standard"], version = "^0.20.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
typer = {extras = ["all"], version = "^0.7.0"}
thankyou = "^0.0.1"
pymysql = "^1.0.2"
python-slugify = "^7.0.0"
sentry-sdk = "^1.11.1"
python-multipart = "^0.0.5"
phonenumbers = "^8.13.1"
pystrix = "^1.2.0"
bcrypt = "^4.0.1"
requests = "^2.28.1"
python-dotenv = "^0.21.0"
jinja2 = "^3.1.2"
mysqldb-wrapper = "^0.10.6"
python-dateutil = "^2.8.2"
peewee = "^3.15.4"
sqlalchemy = "^1.4.44"
alembic = "^1.8.1"
fastapi = "^0.88.0"
sqladmin = {git = "https://github.com/aminalaee/sqladmin.git", rev = "main"}
starlette-admin = {git = "https://github.com/jowilf/starlette-admin.git", rev = "main"}
sqlalchemy-repr = "^0.1.0"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
coverage = "*"
mkdocs = "^1.4.2"
mkdocs-material = "^8.5.10"
mkdocstrings = {extras = ["python"], version = "^0.19.0"}
mkdocs-git-authors-plugin = "^0.7.0"

[tool.poetry.scripts]
firenze = "cli:cli"
fastapi = "api:app"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
