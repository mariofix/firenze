[tool.poetry]
name = "firenze-zvn"
version = "2025.1.0"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{ include = "firenze" }]

[tool.poetry.dependencies]
python = "^3.12"
pymysql = "^1.1.2"
python-dotenv = "^1.0"
requests = "^2.32"
python-slugify = "^8.0.4"
alembic = "^1.18.4"
sqlalchemy = "^2.0.48"
peewee = "^3.17"
bcrypt = "^4.3"
sentry-sdk = "^2.54.0"
python-multipart = "^0.0.20"
jinja2 = "^3.1.6"
pystrix = "^1.2.0"
sqladmin = "^0.23.0"
phonenumbers = "^8.13.52"
sqlalchemy-repr = "^0.1.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
typer = "^0.15.2"
fastapi-debug-toolbar = "*"
python-dateutil = "^2.9"
pydantic = { extras = ["email"], version = "^2.12.5" }
pydantic-settings = "^2.13.1"
fastapi = "^0.115.11"
itsdangerous = "^2.2"
redis = "^5.3.0"
fastapi-cli = "^0.0.7"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
coverage = "*"
ruff = "*"

[tool.poetry.scripts]
firenze = "cli:cli"

[tool.black]
line_length = 88

[tool.ruff]
line-length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
