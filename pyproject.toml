[tool.poetry]
name = "firenze-zvn"
version = "1.0.8"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{include = "firenze"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.95.2"
thankyou = "*"
pymysql = "*"
python-dotenv = "*"
requests = "*"
python-slugify = "*"
alembic = "^1.11.1"
sqlalchemy = "^2.0.15"
peewee = "^3.16.2"
bcrypt = "*"
sentry-sdk = "*"
python-multipart = "*"
jinja2 = "*"
pystrix = "*"
sqladmin = "*"
phonenumbers = "*"
sqlalchemy-repr = "*"
uvicorn = {extras = ["standard"], version = "*"}
passlib = {extras = ["bcrypt"], version = "*"}
python-jose = {extras = ["cryptography"], version = "*"}
typer = {extras = ["all"], version = "*"}
fastapi-debug-toolbar = "*"
python-dateutil = "*"
fastapi-crudrouter = "^0.8.6"
pydantic = {extras = ["email"], version = "^1.10.8"}

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
coverage = "*"
isort = "^5.12.0"

[tool.poetry.scripts]
firenze = "cli:cli"

[tool.black]
line_length = 88

[tool.isort]
profile = "black"
skip_gitignore = true
src_paths = ["firenze"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
