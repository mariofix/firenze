[project]
name = "firenze"
version = "2026.8.1"
description = "Servicio de comunicación y administración para servicio Tatot"
readme = "README.md"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-admin[images,sqlalchemy-with-utils,translation,translation,rediscli] @ git+https://github.com/mariofix/flask-admin.git@autolinks",
    "flask-security[babel,common,fsqla] (>=5.8.1,<7.0.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "flask-limiter (>=4.1.1,<5.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-cors>=6.0.1",
    "flask-smorest>=0.46.2",
    "daleks[contrib] @ git+https://github.com/mariofix/daleks.git",
    "phonenumbers>=9.0.28",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "python-slugify>=8.0.4",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.48",
    "sqlalchemy-repr>=0.1.0",
    "valkey>=6.1.1",
    "bcrypt>=4.3",
    "argon2-cffi>=23.1.0",
    "gunicorn (>=25.3.0,<27.0.0)",
    "flask-alembic (>=3.2.0,<4.0.0)",
    "dynaconf[toml,yaml]>=3.3.4",
    "flask-blueprints>=0.0.6",
]

[project.scripts]
firenze = "firenze.cli:cli"

[project.optional-dependencies]
dev = [
    "flask-debugtoolbar-extrapanels",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-flask (>=1.3.0,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
packages = [{ include = "firenze" }]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
timezone = "America/Santiago"

[tool.black]
line-length = 119
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["firenze"]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]                   # black-compatible
exclude = [".git", "__pycache__", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["firenze"]
