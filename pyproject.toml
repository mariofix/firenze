[project]
name = "firenze-zvn"
version = "2025.1.0"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = [{ name = "Mario Hernandez", email = "mariofix@pm.me" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymysql>=1.1.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "python-slugify>=8.0.4",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.48",
    "peewee>=3.17",
    "bcrypt>=4.3",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "pystrix>=1.2.0",
    "sqladmin>=0.23.0",
    "phonenumbers>=8.13.52",
    "sqlalchemy-repr>=0.1.0",
    "uvicorn[standard]>=0.34.0",
    "python-jose[cryptography]>=3.3.0",
    "typer>=0.15.2",
    "fastapi-debug-toolbar",
    "python-dateutil>=2.9",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "fastapi>=0.115.11",
    "itsdangerous>=2.2",
    "redis>=5.3.0",
    "fastapi-cli>=0.0.7",
]

[project.optional-dependencies]
deploy = ["gunicorn"]
dev = ["pytest", "coverage", "ruff"]

[project.scripts]
firenze = "firenze.cli:cli"

[tool.poetry]
packages = [{include = "firenze"}]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
timezone = "America/Santiago"

[tool.ruff]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firenze"]
