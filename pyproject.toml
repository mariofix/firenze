[tool.poetry]
name = "firenze"
version = "1.0.5"
description = "Servicio de comunicacion y administracion para servicio Tatot"
authors = ["Mario Hernandez <mariofix@pm.me>"]
readme = "README.md"
packages = [{include = "firenze"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
thankyou = "*"
PyMySQL = "*"
python-dotenv = "*"
requests = "*"
python-slugify = "*"
alembic = "*"
SQLAlchemy = "*"
peewee = "*"
bcrypt = "*"
uvicorn = {extras = ["standard"], version = "*"}
passlib = {extras = ["bcrypt"], version = "*"}
python-jose = {extras = ["cryptography"], version = "*"}
sentry-sdk = "*"
python-multipart = "*"
Jinja2 = "*"
pystrix = "*"
sqladmin = "*"
typer = {extras = ["all"], version = "*"}
mysqldb-wrapper = "*"
python-dateutil = "*"
fastapi-crudrouter = "*"
phonenumbers = "*"
sqlalchemy-repr = "*"

[tool.poetry.group.deploy]
optional = true

[tool.poetry.group.deploy.dependencies]
gunicorn = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "*"
pytest-cov = "*"

[tool.poetry.scripts]
firenze = "cli:cli"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
